<script type="text/babel">

                badgeVariant={badgeVariant} nearExpiry={nearExpiry} daysLeft={daysLeft}

// ─── Helper artboards ────────────────────────────────────────

function BadgeGrid() {
  const tiers = ['gold', 'silver', 'bronze'];
  const variants = ['v1', 'v2', 'v3'];
  const cellPad = { padding: '14px 16px' };
  return (
    <div style={{
      width: '100%', height: '100%', background: JDM.bg, color: JDM.text,
      fontFamily: JDM.fontSans, padding: 24, boxSizing: 'border-box',
    }}>
      <div style={{
        display: 'grid', gridTemplateColumns: '110px 1fr 1fr 1fr',
        gap: 0, border: `1px solid ${JDM.border}`, borderRadius: 14, overflow: 'hidden',
        background: JDM.surface,
      }}>
        {/* header row */}
        <div style={{ ...cellPad, fontFamily: JDM.fontMono, fontSize: 10, color: JDM.textMut, letterSpacing: 1.4, textTransform: 'uppercase', borderBottom: `1px solid ${JDM.border}` }}></div>
        {variants.map((v) => (
          <div key={v} style={{ ...cellPad, fontFamily: JDM.fontMono, fontSize: 10, color: JDM.textMut, letterSpacing: 1.4, textTransform: 'uppercase', borderBottom: `1px solid ${JDM.border}`, borderLeft: `1px solid ${JDM.border}` }}>
            {v.toUpperCase()} · {v === 'v1' ? 'sparkle' : v === 'v2' ? 'tier-pill' : 'holographic'}
          </div>
        ))}
        {/* tier rows */}
        {tiers.map((tier, ri) => (
          <React.Fragment key={tier}>
            <div style={{ ...cellPad, fontFamily: JDM.fontMono, fontSize: 11, color: JDM.text, letterSpacing: 1, textTransform: 'uppercase', borderBottom: ri < tiers.length - 1 ? `1px solid ${JDM.border}` : 'none', display: 'flex', alignItems: 'center' }}>
              <span style={{
                width: 8, height: 8, borderRadius: 4, marginRight: 8,
                background: tierColors(tier).main,
              }} />
              {tier}
            </div>
            {variants.map((v) => (
              <div key={v} style={{
                ...cellPad, borderBottom: ri < tiers.length - 1 ? `1px solid ${JDM.border}` : 'none',
                borderLeft: `1px solid ${JDM.border}`,
                display: 'flex', flexDirection: 'column', gap: 10,
              }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <PremiumBadge variant={v} tier={tier} size="md" />
                  <span style={{ fontFamily: JDM.fontMono, fontSize: 10, color: JDM.textMut }}>normal</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <PremiumBadge variant={v} tier={tier} size="md" nearExpiry daysLeft={3} />
                  <span style={{ fontFamily: JDM.fontMono, fontSize: 10, color: JDM.warning }}>expira em 3d</span>
                </div>
              </div>
            ))}
          </React.Fragment>
        ))}
      </div>
      <div style={{
        marginTop: 16, fontFamily: JDM.fontSans, fontSize: 12, color: JDM.textMut, lineHeight: 1.55, maxWidth: 620,
      }}>
        <strong style={{ color: JDM.textSec }}>Recomendação:</strong> V2 tier-pill. A diferenciação de tier (bronze/silver/gold) está visualmente codificada sem depender só de cor — o nome do tier vive dentro do badge, com chave + tipografia mono. O estado de expiração ganha um sub-bloco numérico em vez de "vibrar" o badge inteiro.
      </div>
    </div>
  );
}

function BadgeInContext() {
  const variants = ['v1', 'v2', 'v3'];
  return (
    <div style={{
      width: '100%', height: '100%', background: JDM.bg, padding: 16, boxSizing: 'border-box',
      display: 'flex', flexDirection: 'column', gap: 10,
    }}>
      {variants.map((v) => (
        <FilledStallCard
          key={v} car={SAMPLE_CARS[1]} slotNumber={1} source="default_free"
          premiumActive premiumTier="gold"
          badgeVariant={v}
        />
      ))}
    </div>
  );
}

function BadgeSystemSheet() {
  const rarities = ['common', 'rare', 'legendary'];
  const categories = ['eventos', 'carros', 'comunidade', 'jdm'];
  const sampleByCat = {
    eventos:    ['EVT-001', 'EVT-002', 'EVT-003'],
    carros:     ['CAR-001', 'CAR-002', 'CAR-003'],
    comunidade: ['COM-001', 'COM-002', 'COM-003'],
    jdm:        ['JDM-001', 'JDM-002', 'JDM-003'],
  };
  return (
    <div style={{
      width: '100%', height: '100%', background: JDM.bg, color: JDM.text,
      fontFamily: JDM.fontSans, padding: 24, boxSizing: 'border-box', overflow: 'auto',
    }}>
      {/* Rarity legend */}
      <div style={{
        fontFamily: JDM.fontMono, fontSize: 10, color: JDM.textMut, letterSpacing: 1.4,
        textTransform: 'uppercase', marginBottom: 10,
      }}>Sistema de raridade</div>
      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12, marginBottom: 24,
      }}>
        {rarities.map((rar, i) => {
          const r = rarityColors(rar);
          const code = ['EVT-001', 'EVT-002', 'EVT-003'][i];
          return (
            <div key={rar} style={{
              padding: '14px 14px 12px', borderRadius: 12,
              background: JDM.surface, border: `1px solid ${JDM.border}`,
              display: 'flex', alignItems: 'center', gap: 12,
            }}>
              <HexBadge code={code} earned size="md" />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{
                  display: 'inline-flex', alignItems: 'center', gap: 4,
                  padding: '2px 6px', borderRadius: 3,
                  background: r.tint, color: r.main, border: `1px solid ${r.main}55`,
                  fontFamily: JDM.fontSans, fontWeight: 700, fontSize: 9,
                  letterSpacing: 1.4, textTransform: 'uppercase',
                }}>{r.label}</div>
                <div style={{ fontFamily: JDM.fontSans, fontWeight: 700, fontSize: 13, color: JDM.text, marginTop: 4 }}>
                  {rar === 'common' ? 'Frequente' : rar === 'rare' ? 'Reconhecimento' : 'Sinal de status'}
                </div>
                <div style={{ fontFamily: JDM.fontSans, fontSize: 11.5, color: JDM.textMut, marginTop: 2, lineHeight: 1.4 }}>
                  {rar === 'common' ? 'Outline + glifo neutros.' : rar === 'rare' ? 'Outline gold + tint quente.' : 'Outline brand + ponto luminoso.'}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Catalog grid by category */}
      <div style={{
        fontFamily: JDM.fontMono, fontSize: 10, color: JDM.textMut, letterSpacing: 1.4,
        textTransform: 'uppercase', marginBottom: 10,
      }}>Catálogo · 12 conquistas · 4 categorias</div>
      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12,
      }}>
        {categories.map((cat) => {
          const meta = categoryMeta(cat);
          return (
            <div key={cat} style={{
              padding: '12px 12px 14px', borderRadius: 12,
              background: JDM.surface, border: `1px solid ${JDM.border}`,
            }}>
              <div style={{
                display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10,
              }}>
                <span style={{ width: 8, height: 8, borderRadius: 4, background: meta.accent }} />
                <span style={{
                  fontFamily: JDM.fontSans, fontWeight: 700, fontSize: 12, color: JDM.text,
                  letterSpacing: 0.4,
                }}>{meta.label}</span>
              </div>
              <div style={{
                display: 'flex', flexDirection: 'column', gap: 12, alignItems: 'center',
              }}>
                {sampleByCat[cat].map((code) => (
                  <HexBadge key={code} code={code} earned size="md" showLabel />
                ))}
              </div>
            </div>
          );
        })}
      </div>

      <div style={{
        marginTop: 18, fontFamily: JDM.fontSans, fontSize: 12, color: JDM.textMut, lineHeight: 1.55, maxWidth: 640,
      }}>
        <strong style={{ color: JDM.textSec }}>Padrão visual:</strong> hexágono flat-top (clip-path), anel externo na cor da raridade, miolo na cor de superfície, glifo centralizado em <code style={{ fontFamily: JDM.fontMono, color: JDM.text }}>JDM.fontMono</code>. Lendárias ganham um ponto luminoso no canto superior-direito. Bloqueadas usam grayscale + glifo de cadeado.
      </div>
    </div>
  );
}

function XPSystemSheet() {
  const sampleXPs = [50, 320, 1247, 3200, 6420];
  return (
    <div style={{
      width: '100%', height: '100%', background: JDM.bg, color: JDM.text,
      fontFamily: JDM.fontSans, padding: 24, boxSizing: 'border-box', overflow: 'auto',
    }}>
      <div style={{
        fontFamily: JDM.fontMono, fontSize: 10, color: JDM.textMut, letterSpacing: 1.4,
        textTransform: 'uppercase', marginBottom: 10,
      }}>5 ranks · thresholds server-side</div>

      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 10, marginBottom: 24,
      }}>
        {RANK_TIERS.map((tier, i) => {
          const exampleXp = sampleXPs[i];
          const isTop = tier.next == null;
          const inTier = isTop ? 1420 : exampleXp - tier.min;
          const span = isTop ? 1 : tier.nextAt - tier.min;
          return (
            <div key={tier.name} style={{
              padding: '12px 12px 14px', borderRadius: 12,
              background: JDM.surface, border: `1px solid ${JDM.border}`,
            }}>
              <div style={{
                display: 'inline-flex', alignItems: 'center', gap: 5,
                padding: '3px 7px', borderRadius: 4,
                background: JDM.brandTint, color: JDM.brandSoft,
                border: `1px solid rgba(225,6,0,0.45)`,
                fontFamily: JDM.fontSans, fontWeight: 700, fontSize: 9,
                letterSpacing: 1.6, textTransform: 'uppercase', marginBottom: 8,
              }}>{tier.name}</div>
              <div style={{
                fontFamily: JDM.fontMono, fontSize: 10, color: JDM.textMut, marginBottom: 6,
              }}>{tier.min.toLocaleString('pt-BR')}{isTop ? '+' : `–${(tier.nextAt - 1).toLocaleString('pt-BR')}`} XP</div>
              <XPScoreboardMini
                xp={exampleXp} rank={tier.name} nextRank={tier.next}
                inTier={inTier} span={span} isTop={isTop}
              />
            </div>
          );
        })}
      </div>

      <div style={{
        fontFamily: JDM.fontMono, fontSize: 10, color: JDM.textMut, letterSpacing: 1.4,
        textTransform: 'uppercase', marginBottom: 10,
      }}>Tabela de pontos</div>
      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 8,
      }}>
        {XP_RULES.map((rule, i) => {
          const tone = rule.tone === 'gold' ? JDM.gold
                     : rule.tone === 'silver' ? JDM.silver
                     : rule.tone === 'brand' ? JDM.brand
                     : JDM.brandSoft;
          const Glyph = (BadgeGlyph[rule.icon] || BadgeGlyph.medal);
          return (
            <div key={i} style={{
              display: 'flex', alignItems: 'center', gap: 10,
              padding: '10px 12px', borderRadius: 10,
              background: JDM.surface, border: `1px solid ${JDM.border}`,
            }}>
              <div style={{
                width: 30, height: 30, borderRadius: 8,
                background: 'rgba(255,255,255,0.04)', color: tone,
                display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
              }}><Glyph s={15} /></div>
              <div style={{ flex: 1, minWidth: 0, fontFamily: JDM.fontSans, fontSize: 13, color: JDM.text }}>{rule.action}</div>
              <div style={{ fontFamily: JDM.fontMono, fontWeight: 700, fontSize: 14, color: tone }}>+{rule.points}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function XPScoreboardMini({ xp, rank, nextRank, inTier, span, isTop }) {
  const pct = isTop ? 100 : Math.min(100, Math.round((inTier / span) * 100));
  return (
    <div>
      <div style={{
        fontFamily: JDM.fontDisplay, fontSize: 26, lineHeight: 1, color: JDM.text, letterSpacing: -1,
      }}>{xp.toLocaleString('pt-BR')}</div>
      <div style={{
        marginTop: 6, height: 5, borderRadius: 3, background: JDM.surfaceDeep, overflow: 'hidden',
        border: `1px solid ${JDM.border}`,
      }}>
        <div style={{
          width: `${pct}%`, height: '100%',
          background: `linear-gradient(90deg, ${JDM.brandDeep}, ${JDM.brand})`,
        }} />
      </div>
      <div style={{
        marginTop: 4, fontFamily: JDM.fontMono, fontSize: 9, color: JDM.textMut, letterSpacing: 0.4,
      }}>{isTop ? 'Topo' : `→ ${nextRank}`}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
