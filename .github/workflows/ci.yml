name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    # A suite da API roda serial (vitest singleFork: um Postgres compartilhado
    # com resetDatabase no beforeEach) e sozinha ja passa de 15min, o que com
    # lint + typecheck + build estourava o teto anterior de 20 e cancelava o
    # job no meio do `pnpm test`, sem nunca chegar no `pnpm build`.
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jdm
          POSTGRES_PASSWORD: jdm
          POSTGRES_DB: jdm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jdm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jdm:jdm@localhost:5432/jdm?schema=public
      GIT_SHA: ${{ github.sha }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_ADMIN: ${{ secrets.SENTRY_PROJECT_ADMIN }}
      SENTRY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @ccc/db db:generate

      - run: pnpm --filter @ccc/db exec prisma migrate deploy

      - run: pnpm --filter @ccc/db build

      - run: pnpm --filter @ccc/shared build

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  expo-prebuild-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ccc/shared build
      # app.config.ts imports @ccc/design/brand; Expo reads the config via Node's
      # native ESM loader, which needs the compiled dist (it can't parse TS src).
      - run: pnpm --filter @ccc/design build
      - run: pnpm --filter @ccc/mobile typecheck
      - run: pnpm --filter @ccc/mobile exec expo config --type public
